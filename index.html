<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Reste à Vivre</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--txt:#1c2330;--mut:#6b7585;--pri:#0f766e;--pri2:#ccfbf1;--ok:#15803d;--okbg:#dcfce7;--warn:#b45309;--warnbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2;--line:#e5e8ee}
@media (prefers-color-scheme:dark){:root{--bg:#10141b;--card:#1a202b;--txt:#eef1f6;--mut:#99a3b3;--pri:#2dd4bf;--pri2:#123a38;--ok:#4ade80;--okbg:#12301d;--warn:#fbbf24;--warnbg:#3a2c0e;--bad:#f87171;--badbg:#3b1515;--line:#2a3240}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
header{background:var(--pri);color:#fff;padding:14px 16px calc(14px);text-align:center}
@media (prefers-color-scheme:dark){header{color:#04201d}}
header h1{margin:0;font-size:18px}
.mois{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:6px}
.mois button{background:rgba(255,255,255,.25);border:0;color:inherit;width:34px;height:34px;border-radius:50%;font-size:18px}
.mois span{min-width:150px;font-weight:600;text-transform:capitalize}
main{max-width:560px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.big{text-align:center}
.big small{color:var(--mut)}
.big .v{font-size:36px;font-weight:700;margin:2px 0}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .m{color:var(--mut);font-size:13px}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--pri)}
.tip{padding:10px 12px;border-radius:10px;margin-bottom:8px;font-size:15px}
.tip.ok{background:var(--okbg);color:var(--ok)}.tip.warn{background:var(--warnbg);color:var(--warn)}.tip.bad{background:var(--badbg);color:var(--bad)}.tip.info{background:var(--pri2);color:var(--txt)}
h2{font-size:16px;margin:0 0 8px}
form{display:grid;gap:8px;margin-top:10px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--txt);font-size:16px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:12px;font-size:16px;font-weight:600}
@media (prefers-color-scheme:dark){.btn{color:#04201d}}
.del{background:none;border:0;color:var(--bad);font-size:18px;padding:0 4px}
.vide{color:var(--mut);text-align:center;padding:10px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:10px 2px;color:var(--mut);font-size:12px}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--pri);font-weight:600}
.note{color:var(--mut);font-size:12px;text-align:center;margin-top:16px}
</style>
</head>
<body>
<header>
  <h1>Reste à Vivre</h1>
  <div class="mois"><button id="prev" aria-label="Mois précédent">‹</button><span id="moisLabel"></span><button id="next" aria-label="Mois suivant">›</button></div>
</header>
<main id="app"></main>
<nav id="nav">
  <button data-t="resume"><b>📊</b>Résumé</button>
  <button data-t="revenus"><b>💶</b>Revenus</button>
  <button data-t="charges"><b>🏠</b>Charges</button>
  <button data-t="depenses"><b>🛒</b>Dépenses</button>
</nav>
<script>
const KEY = 'resteavivre.v1';
const CAT_FIXES = ['Logement','Abonnements','Transport','Assurances','Crédits','Autre'];
const CAT_VAR = ['Courses','Transport','Loisirs','Santé','Vêtements','Autre'];
const eur = new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'});
const fmt = n => eur.format(n || 0);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v).replace(/\s/g,'').replace(',','.')); return isFinite(n) && n > 0 ? n : 0; };
const sum = a => a.reduce((t, x) => t + x.amount, 0);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const ymKey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');

function load(){
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && d.fixes && d.months) return d; } catch(e){}
  return { fixes: [], months: {}, objectif: 0 };
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

let S = load();
let date = new Date(); date.setDate(1);
let tab = 'resume';

function M(){
  const k = ymKey(date);
  if (!S.months[k]) S.months[k] = { revenus: [], depenses: [] };
  return S.months[k];
}

function calc(){
  const m = M();
  const rev = sum(m.revenus), fix = sum(S.fixes), dep = sum(m.depenses);
  const reste = rev - fix - dep;
  return { m, rev, fix, dep, reste };
}

function daysLeft(){
  const now = new Date();
  if (ymKey(now) !== ymKey(date)) return 0;
  const last = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  return last - now.getDate() + 1;
}

function conseils(c){
  const t = [];
  const pct = x => Math.round(x * 100);
  if (c.rev === 0) {
    t.push(['info', 'Commence par ajouter tes revenus du mois (salaire, aides, primes…) dans l’onglet Revenus.']);
    return t;
  }
  if (c.reste < 0) {
    t.push(['bad', 'Tu dépenses ' + fmt(-c.reste) + ' de plus que tes revenus ce mois-ci. Regarde d’abord les dépenses variables (' + fmt(c.dep) + ') : ce sont les plus faciles à réduire.']);
  }
  const loyer = sum(S.fixes.filter(x => x.cat === 'Logement'));
  if (loyer / c.rev > 0.33) t.push(['warn', 'Ton logement représente ' + pct(loyer / c.rev) + ' % de tes revenus (repère courant : 33 % maximum).']);
  const abo = sum(S.fixes.filter(x => x.cat === 'Abonnements'));
  if (abo / c.rev > 0.08) t.push(['warn', 'Tes abonnements pèsent ' + pct(abo / c.rev) + ' % de tes revenus (' + fmt(abo) + '). Vérifie ceux que tu n’utilises plus.']);
  if (c.fix / c.rev > 0.6) t.push(['warn', 'Tes charges fixes représentent ' + pct(c.fix / c.rev) + ' % de tes revenus, ce qui laisse peu de marge.']);
  if (c.dep > 0) {
    const bycat = {};
    c.m.depenses.forEach(x => bycat[x.cat] = (bycat[x.cat] || 0) + x.amount);
    const top = Object.entries(bycat).sort((a, b) => b[1] - a[1])[0];
    t.push(['info', 'Ta plus grosse dépense variable : ' + top[0] + ' (' + fmt(top[1]) + ', ' + pct(top[1] / c.dep) + ' % de tes dépenses variables).']);
  }
  if (S.objectif > 0) {
    if (c.reste >= S.objectif) t.push(['ok', 'Objectif d’épargne atteint : tu peux mettre ' + fmt(S.objectif) + ' de côté et il te reste ' + fmt(c.reste - S.objectif) + '.']);
    else if (c.reste > 0) t.push(['warn', 'Il manque ' + fmt(S.objectif - c.reste) + ' pour atteindre ton objectif d’épargne de ' + fmt(S.objectif) + '.']);
  } else if (c.reste > 0) {
    t.push(['ok', 'Tu peux mettre jusqu’à ' + fmt(c.reste) + ' de côté ce mois-ci. Fixe-toi un objectif d’épargne ci-dessous.']);
  }
  const dl = daysLeft();
  if (dl > 0 && c.reste - S.objectif > 0) t.push(['info', 'Il te reste environ ' + fmt((c.reste - S.objectif) / dl) + ' par jour jusqu’à la fin du mois.']);
  t.push(['info', 'Repère 50/30/20 : besoins ' + fmt(c.rev * .5) + ', envies ' + fmt(c.rev * .3) + ', épargne ' + fmt(c.rev * .2) + '.']);
  return t;
}

function listHtml(items, kind){
  if (!items.length) return '<div class="vide">Rien pour l’instant</div>';
  return items.map(x => '<div class="row"><div><div>' + esc(x.label) + '</div>' + (x.cat ? '<div class="m">' + esc(x.cat) + '</div>' : '') + '</div><div>' + fmt(x.amount) + ' <button class="del" data-del="' + kind + ':' + x.id + '" aria-label="Supprimer">✕</button></div></div>').join('');
}

function formHtml(kind, cats){
  return '<form data-form="' + kind + '"><input name="label" placeholder="Nom (ex : ' + (kind === 'revenus' ? 'Salaire' : kind === 'charges' ? 'Loyer' : 'Courses') + ')" required>' +
    '<input name="amount" inputmode="decimal" placeholder="Montant en €" required>' +
    (cats ? '<select name="cat">' + cats.map(c => '<option>' + c + '</option>').join('') + '</select>' : '') +
    '<button class="btn">Ajouter</button></form>';
}

function render(){
  const c = calc();
  $('#moisLabel').textContent = date.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  let h = '';
  if (tab === 'resume') {
    const pctDep = c.rev > 0 ? Math.min(100, Math.round((c.fix + c.dep) / c.rev * 100)) : 0;
    h += '<div class="card big"><small>Reste à vivre ce mois-ci</small><div class="v ' + (c.reste < 0 ? 'neg' : 'pos') + '">' + fmt(c.reste) + '</div>' +
      '<div class="bar"><i style="width:' + pctDep + '%"></i></div><small>' + pctDep + ' % de tes revenus déjà utilisés</small></div>';
    h += '<div class="card"><div class="row"><span>Revenus</span><b>' + fmt(c.rev) + '</b></div><div class="row"><span>Charges fixes</span><b>' + fmt(c.fix) + '</b></div><div class="row"><span>Dépenses variables</span><b>' + fmt(c.dep) + '</b></div></div>';
    h += '<div class="card"><h2>Conseils</h2>' + conseils(c).map(x => '<div class="tip ' + x[0] + '">' + esc(x[1]) + '</div>').join('') + '</div>';
    h += '<div class="card"><h2>Objectif d’épargne mensuel</h2><form data-form="objectif"><input name="amount" inputmode="decimal" placeholder="Ex : 100" value="' + (S.objectif || '') + '"><button class="btn">Enregistrer</button></form></div>';
    h += '<div class="note">Tes données restent sur ton téléphone. Ces conseils sont des repères, pas un avis financier officiel.</div>';
  } else if (tab === 'revenus') {
    h += '<div class="card"><h2>Revenus du mois · ' + fmt(c.rev) + '</h2>' + listHtml(c.m.revenus, 'revenus') + formHtml('revenus') + '</div>';
  } else if (tab === 'charges') {
    h += '<div class="card"><h2>Charges fixes (chaque mois) · ' + fmt(c.fix) + '</h2>' + listHtml(S.fixes, 'charges') + formHtml('charges', CAT_FIXES) + '</div>';
  } else {
    h += '<div class="card"><h2>Dépenses du mois · ' + fmt(c.dep) + '</h2>' + listHtml(c.m.depenses, 'depenses') + formHtml('depenses', CAT_VAR) + '</div>';
  }
  $('#app').innerHTML = h;
}

function $(s){ return document.querySelector(s); }

document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  const kind = f.dataset.form;
  const d = new FormData(f);
  const amount = num(d.get('amount'));
  if (kind === 'objectif') { S.objectif = amount; save(); render(); return; }
  const label = String(d.get('label') || '').trim();
  if (!label || !amount) return;
  const item = { id: uid(), label, amount };
  if (kind === 'revenus') M().revenus.push(item);
  else if (kind === 'charges') { item.cat = d.get('cat'); S.fixes.push(item); }
  else { item.cat = d.get('cat'); M().depenses.push(item); }
  save(); render();
});

document.addEventListener('click', e => {
  const del = e.target.closest('[data-del]');
  if (del) {
    const [kind, id] = del.dataset.del.split(':');
    if (kind === 'revenus') M().revenus = M().revenus.filter(x => x.id !== id);
    else if (kind === 'charges') S.fixes = S.fixes.filter(x => x.id !== id);
    else M().depenses = M().depenses.filter(x => x.id !== id);
    save(); render(); return;
  }
  const nb = e.target.closest('#nav button');
  if (nb) { tab = nb.dataset.t; render(); window.scrollTo(0, 0); }
});

$('#prev').onclick = () => { date.setMonth(date.getMonth() - 1); render(); };
$('#next').onclick = () => { date.setMonth(date.getMonth() + 1); render(); };
render();
</script>
</body>
</html>
